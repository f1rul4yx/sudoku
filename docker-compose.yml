services:
  db:
    image: postgres:16-alpine
    container_name: sudoku-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sudoku
      POSTGRES_PASSWORD: ${DB_PASSWORD:-TuPasswordSegura123}
      POSTGRES_DB: sudoku
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudoku -d sudoku"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sudoku-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: f1rul4yx/sudoku:latest
    container_name: sudoku-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-CambiaEstoCon32CaracteresMinimo}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: sudoku
      DB_PASSWORD: ${DB_PASSWORD:-TuPasswordSegura123}
      DB_NAME: sudoku
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sudoku-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sudoku-network:
    driver: bridge